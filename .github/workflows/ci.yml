name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # allow manual runs (e.g. full-set eval on demand)
    inputs:
      eval_limit:
        description: "Number of golden items to evaluate (0 = all)"
        required: false
        default: "15"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval

      - name: Type check
        run: mypy src

      - name: Unit tests
        run: pytest --cov=rag_revops --cov-report=term-missing

  # Faithfulness gate: runs the offline eval against the committed demo index and
  # fails the build if mean faithfulness drops below eval.min_faithfulness (0.85).
  #
  # Cost & safety notes:
  #   - The eval calls Claude + Cohere, so it spends API credit each run. It runs a
  #     bounded subset (default 15 items) to keep PR cost small; trigger a full run
  #     manually via the "Run workflow" button (workflow_dispatch) with eval_limit=0.
  #   - It requires ANTHROPIC_API_KEY and COHERE_API_KEY as repo secrets. The job is
  #     guarded so it skips cleanly (rather than failing confusingly) when secrets
  #     are absent — e.g. on fork PRs that can't access secrets.
  faithfulness-gate:
    runs-on: ubuntu-latest
    needs: test
    # Skip on PRs coming from forks (which can't access repo secrets).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      EVAL_LIMIT: ${{ github.event.inputs.eval_limit || '15' }}
      # Operational metrics sink written by every request the eval issues.
      RAG_METRICS_PATH: metrics/requests.jsonl
      # Ties each request's metrics to the config/prompt version that produced
      # them, so a prompt change is visibly attributable to a metric shift.
      RAG_CONFIG_VERSION: ${{ github.sha }}
      # Optional Langfuse tracing — only active if these secrets are configured.
      # Absent (the common case) → tracing is a transparent no-op; the gate still runs.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,observability]"

      - name: Verify secrets are present
        id: secretcheck
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$COHERE_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API keys not configured as secrets - skipping faithfulness gate."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify committed demo index exists
        if: steps.secretcheck.outputs.present == 'true'
        run: |
          if [ ! -d "data/processed/chroma" ]; then
            echo "::error::No committed vector index at data/processed/chroma. Build it locally and commit it (see README)."
            exit 1
          fi

      - name: Run faithfulness gate
        if: steps.secretcheck.outputs.present == 'true'
        run: |
          python -m eval.run_eval \
            --golden eval/golden.jsonl \
            --out eval/report.json \
            --limit "$EVAL_LIMIT" \
            --gate

      # Phase 2/3: the eval above ran every golden question through the live
      # pipeline, so metrics/requests.jsonl now holds real per-request latency,
      # LLM-call counts, citation coverage, and errors. Gate on the operational
      # signals — no extra API spend, since the traffic already happened.
      - name: Run operational-metrics gate
        if: steps.secretcheck.outputs.present == 'true'
        run: |
          python -m rag_revops.metrics_report \
            --gate \
            --min-coverage 0.90 \
            --max-failure-rate 0.05 \
            --max-p95-ms 90000

      - name: Upload eval + metrics reports
        if: steps.secretcheck.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/report.json
            metrics/requests.jsonl
          if-no-files-found: ignore
