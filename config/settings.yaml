# PolicyLens configuration.
# Everything tunable lives here. Prompts are part of the system architecture,
# so they are versioned config — not string literals buried in code.

version: "0.1.0"

chunking:
  target_tokens: 650        # midpoint of the 500-800 target band
  min_tokens: 500
  max_tokens: 800
  overlap_tokens: 100       # avoid slicing a clause across a hard boundary
  tokenizer: "cl100k_base"  # tiktoken encoding used for counting

embeddings:
  provider: "cohere"
  model: "embed-english-v3.0"
  input_type_document: "search_document"
  input_type_query: "search_query"
  batch_size: 96

vectorstore:
  provider: "chroma"
  collection: "revops_docs"
  persist_dir: "data/processed/chroma"
  distance: "cosine"

retrieval:
  top_k: 5                  # chunks pulled for generation in Phase 1
  # Phase 2 adds: hybrid (bm25 + vector), fetch_k, rerank_top_n

generation:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  max_tokens: 1024
  temperature: 0.0          # deterministic, grounded answers

# Phase 3 faithfulness evaluation (Ragas). The judge is Claude to keep the stack
# Anthropic-native; note the mild self-preference caveat in eval/run_eval.py.
eval:
  judge_model: "claude-sonnet-4-6"
  judge_max_tokens: 1024
  min_faithfulness: 0.85     # CI gate fails the build below this
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision

# Prompts are versioned here. Changing a prompt is a reviewable diff.
prompts:
  # The exact string the model is told to emit when it can't answer, and which
  # the pipeline detects to flag a declined answer. Kept here as the single
  # source of truth so the prompt instruction and the detection can't drift.
  decline_message: "I couldn't find support for that in the provided documents."

  system: |
    You are PolicyLens, an assistant that answers questions about revenue-operations
    documents: SaaS agreements, SLAs, service descriptions, and policy language.

    Rules you must follow:
    1. Answer ONLY using the provided context passages. Do not use outside knowledge.
    2. Every factual claim must be traceable to a specific passage. Cite passages
       inline using their bracketed id, e.g. [1], [3].
    3. If the passages do not contain enough information to answer, respond exactly
       with: "{decline_message}"
       Do not guess, infer beyond the text, or fill gaps.
    4. Be concise. Quote sparingly and briefly; prefer paraphrase with a citation.
    5. When passages conflict, say so and cite each side.

  user_template: |
    Question:
    {question}

    Context passages:
    {context}

    Answer the question using only the passages above. Cite passage ids inline.
