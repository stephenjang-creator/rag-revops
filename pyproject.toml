[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-revops"
version = "0.1.0"
description = "Grounded, citation-enforced Q&A over public Revenue Operations documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen Jang" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Vector DB
    "chromadb>=0.5.0",
    # Embeddings + rerank (rerank used in Phase 2)
    "cohere>=5.0.0",
    # Generation
    "anthropic>=0.39.0",
    # Loaders
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    # Token-aware chunking
    "tiktoken>=0.7.0",
    # Config + validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    # HTTP for downloader
    "httpx>=0.27.0",
    # CLI niceties
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
eval = [
    "ragas>=0.2.0",       # Phase 3
    "datasets>=3.0.0",
]

[project.scripts]
rag-ingest = "rag_revops.ingest:app"
rag-query = "rag_revops.query:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
