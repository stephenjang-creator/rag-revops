[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-revops"
version = "0.1.0"
description = "Grounded, citation-enforced Q&A over public Revenue Operations documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen Jang" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Vector DB
    "chromadb>=0.5.0",
    # Lexical retrieval (Phase 2 hybrid)
    "rank-bm25>=0.2.2",
    # Embeddings + rerank (rerank used in Phase 2)
    "cohere>=5.0.0",
    # Generation
    "anthropic>=0.39.0",
    # Loaders
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    # Token-aware chunking
    "tiktoken>=0.7.0",
    # Config + validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    # HTTP for downloader
    "httpx>=0.27.0",
    # CLI niceties
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0,<0.15.0",
    "mypy>=1.11.0",
]
eval = [
    # The evaluator uses the Anthropic client directly (see eval/judge.py), so no
    # Ragas / langchain-community judge stack is required — this avoids the version
    # conflicts between Ragas' old-langchain expectations and LangGraph's 1.x core.
    # No extra dependencies beyond what the pipeline already installs.
]
observability = [
    # Optional: LLM tracing. The pipeline imports rag_revops.observability
    # unconditionally, but it degrades to a no-op if langfuse isn't installed or
    # LANGFUSE_* env vars are absent. Install this extra to enable tracing.
    "langfuse>=2.0,<4.0",
]

[project.scripts]
rag-ingest = "rag_revops.ingest:app"
rag-query = "rag_revops.query:app"
rag-metrics = "rag_revops.metrics_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# app.py inserts src/ onto sys.path before importing the package, so the
# streamlit import necessarily follows executable code. This is intentional.
"app.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument in argument defaults is the intended Typer idiom
# (dependency injection), not a mutable-default bug. Whitelist the calls so
# B008 still catches real mutable defaults elsewhere.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
